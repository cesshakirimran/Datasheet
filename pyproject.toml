[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harag"
version = "1.0.0"
description = "Hallucination-aware retrieval-augmented knowledge base for enterprise knowledge management (MSc thesis prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7",
  "PyYAML>=6.0", "pypdf>=4.0", "python-docx>=1.1",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.36"]
ragas = ["ragas>=0.2.6,<0.3", "langchain-openai>=0.2"]
dev = ["pytest>=8.0", "flake8>=7.0"]

[project.scripts]
harag = "harag.cli:main"

[tool.setuptools.packages.find]
include = ["harag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
